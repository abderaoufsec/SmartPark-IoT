# M1B scenario 1 — boot identity, FR-011 console reconcile, bounded rejection.
# Assertion style: wait-serial matches exact byte substrings of the serial log.
# Runs against the esp32dev firmware.bin referenced by ../wokwi.toml.
name: 'M1B boot + console reconcile'
version: 1
author: 'SmartPark-IoT'

steps:
  # Boot identity: the M1B firmware and its honesty banner
  - wait-serial: 'SmartPark-IoT V2 (M1B) boot'
  - wait-serial: 'behavior: SIMULATED-LOGIC ONLY - NOT PHYSICALLY VALIDATED'

  # Explicit reconciliation always emits a visible event (FR-011 console)
  - write-serial: 'R 2\n'
  - wait-serial: 'OCCUPANCY_RECONCILED'
  - write-serial: '?\n'
  - wait-serial: 'STATUS occ=KNOWN count=2 free=4 gate=CLOSED'

  # Out-of-range reconcile (9 > CAPACITY 6): visible rejection, no clamping,
  # count unchanged (V1 finding F-10)
  - write-serial: 'R 9\n'
  - wait-serial: 'OCCUPANCY_CHANGE_REJECTED'
  - write-serial: '?\n'
  - wait-serial: 'STATUS occ=KNOWN count=2 free=4'

  # Unrecognized input prints usage; the parser is bounded (no crash/no echo)
  - write-serial: 'X\n'
  - wait-serial: 'OK usage: R <0..6> | ?'
