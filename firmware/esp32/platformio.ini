; SmartPark-IoT — ESP32 firmware baseline (milestone M0)
;
; Goal of M0: compile the original V1 logic unchanged with pinned, reproducible
; toolchain and library versions. Behavior refactoring happens in M1, not here.
;
; Pinned versions and why:
;   espressif32@6.13.0           last release of the 6.x line -> Arduino-ESP32 2.x
;                                core, matching the era the V1 sketch was written
;                                for (7.x/8.x ship Arduino-ESP32 3.x with breaking
;                                changes; migration is an M1 task).
;   ESP32Servo@1.2.1             1.x line compatible with Arduino-ESP32 2.x;
;                                provides ESP32PWM::allocateTimer(), setPeriodHertz()
;                                and attach(pin, min, max) used by the V1 code.
;   LiquidCrystal_I2C@1.1.4      provides init(), backlight(), setCursor() used
;                                by the V1 code (I2C address 0x27, 16x2).
;
; Build:   pio run                (from firmware/esp32/)
; Upload:  pio run -t upload
; Monitor: pio device monitor     (115200 baud)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    madhephaestus/ESP32Servo@1.2.1
