; SmartPark-IoT — ESP32 firmware (milestone M1A)
;
; Two environments:
;   esp32dev  cross-compile for the ESP32 DevKit (Arduino framework)
;   native    host build for unit tests of lib/smartpark_core (no hardware)
;
; Pinned versions and why:
;   espressif32@6.13.0           last release of the 6.x line -> Arduino-ESP32 2.x
;                                core, matching the era the V1 sketch was written
;                                for (7.x/8.x ship Arduino-ESP32 3.x with breaking
;                                changes; migration is an M1 task).
;   ESP32Servo@1.2.1             1.x line compatible with Arduino-ESP32 2.x;
;                                provides setPeriodHertz(), attach(pin, min, max)
;                                and attached() used by src/main.cpp.
;   LiquidCrystal_I2C@1.1.4      provides init(), backlight(), setCursor() used
;                                by src/main.cpp (I2C address 0x27, 16x2).
;   platform = native + Unity    bundled with PlatformIO Core 6.2.0 (CI pins
;                                platformio==6.2.0, so the Unity version is
;                                implicitly pinned too). Host compiler: any
;                                system g++/clang/MSVC (CI: ubuntu-latest g++).
;
; Build:   pio run                (from firmware/esp32/)
; Test:    pio test -e native     (host unit tests, no ESP32 required)
; Upload:  pio run -t upload
; Monitor: pio device monitor     (115200 baud)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
    madhephaestus/ESP32Servo@1.2.1

[env:native]
; Host-side unit tests for the pure-logic library. src/ (Arduino glue) is NOT
; built here: PlatformIO excludes project sources from test builds by default
; (test_build_src = no), so no ESP32 headers are ever needed.
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -Wall
    -Wextra
    -Werror
lib_compat_mode = off
lib_ldf_mode = chain
